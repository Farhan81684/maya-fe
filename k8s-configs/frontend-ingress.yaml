apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maya-frontend-ingress 
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" 
spec:
  ingressClassName: nginx  # ✅ Yeh line CLASS ko fix karegi
  rules:
  - host: maya.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: maya-frontend-service
            port:
              number: 80
